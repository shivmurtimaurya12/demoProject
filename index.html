<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      div {
        margin-bottom: 14px;
        input {
          border: 2px solid black;
        }
        font-size: 24px;
      }
      button {
        background-color: rgb(47, 47, 234);
        color: white;
        border: none;
        padding-left: 20px;
        padding-right: 20px;
        padding-top: 14px;
        padding-bottom: 14px;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <h1>Hello friends !</h1>
    <form>
      <div class="email">
        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="abc@gmail.com" />
      </div>
      <div class="password">
        <label for="password">Password:</label>
        <input
          type="password"
          id="password"
          placeholder="enter your password"
        />
      </div>
      <button>Submit</button>
    </form>
  </body>
</html>
